# ============================================================================
# dsh-task-flow —— DSH 插件挂载声明
# ============================================================================
# 这是插件的挂载声明。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件会把「任务星图」插入 Web profile 的配置树。
#
# 安装方式（推荐，无需手工复制/手工改 profile）：
#   dsh plugin --profile web add github:wqy-cell/dsh-task-flow
# 或本地开发安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: task-flow
      name: dsh-task-flow
